[program:personal_task_system]
# 命令
command=/path/to/venv/bin/gunicorn -c gunicorn.conf.py app.main:app

# 目录
directory=/path/to/backend

# 自动启动
autostart=true

# 自动重启
autorestart=true

# 启动等待时间
startsecs=10

# 停止等待时间
stopwaitsecs=10

# 进程用户
user=your_user

# 进程组
group=your_group

# 日志文件
stdout_logfile=/path/to/backend/logs/supervisor.stdout.log
stderr_logfile=/path/to/backend/logs/supervisor.stderr.log

# 日志级别
loglevel=info


[program:celery_worker]
command=/path/to/venv/bin/celery -A app.core.celery_config worker --loglevel=info --concurrency=4
directory=/path/to/backend
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
user=your_user
group=your_group
stdout_logfile=/path/to/backend/logs/celery_worker.stdout.log
stderr_logfile=/path/to/backend/logs/celery_worker.stderr.log
loglevel=info
