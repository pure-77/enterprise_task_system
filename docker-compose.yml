# =============================================================================
# 生产部署编排：MySQL + Redis + PostgreSQL(pgvector) + FastAPI（含前端静态站点）
#                + Celery worker/beat
#   - 不使用 nginx，前端由 backend 容器内的 FastAPI 直接托管（8001 端口）
#   - MySQL / Redis / PostgreSQL 只发布到宿主机回环地址 127.0.0.1
#     公网无法直连，本机调试通过 SSH 隧道访问（见文末说明）
#   - pgvector 为 Agent 的 Checkpointer / Store 预留：pg17 + vector 扩展
#   - 敏感配置（LLM Key、邮箱、JWT）从 backend/.env 读取，compose 里只做必要覆盖
# =============================================================================

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-task_system}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 只绑回环：公网/局域网均无法直连，需经 SSH 隧道
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # 只绑回环：需经 SSH 隧道访问
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  # ---------------------------------------------------------------------------
  # PostgreSQL + pgvector：Agent 短期记忆（LangGraph Checkpointer）与长期记忆（Store）
  #   - 数据目录默认落到宿主机 /data/pgvector_data，可用 PGVECTOR_DATA_DIR 覆盖
  #   - 首次初始化时执行 docker/pgvector/init.sql 创建 vector 扩展
  #   - 端口只绑 127.0.0.1，需经 SSH 隧道访问；如需完全关闭，删除 ports 即可
  # ---------------------------------------------------------------------------
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: pg-vector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-postgres}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-Zwd531965692}
      POSTGRES_DB: ${PGVECTOR_DB:-vector_db}
      TZ: Asia/Shanghai
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=100
    volumes:
      - ${PGVECTOR_DATA_DIR:-/data/pgvector_data}:/var/lib/postgresql/data
      - ./docker/pgvector/init.sql:/docker-entrypoint-initdb.d/10-vector.sql:ro
    ports:
      - "127.0.0.1:${PGVECTOR_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: personal-task-system:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # 容器内服务发现：覆盖 .env 里的 localhost 配置
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root123456}@mysql:3306/${MYSQL_DATABASE:-task_system}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
      # Agent：迁移后默认使用 langgraph；内存 checkpointer 与单 worker 匹配
      AGENT_ENGINE: langgraph
      AGENT_MCP_ENABLED: "true"
      AGENT_CHECKPOINTER: memory
      AGENT_TRACE_ENABLED: "true"
      # 待 Agent 代码支持 PG 后端后再启用：
      # 当前 Settings 为 extra=forbid，提前写入未知变量会导致启动失败
      # AGENT_POSTGRES_URL: postgresql://${PGVECTOR_USER:-postgres}:${PGVECTOR_PASSWORD:-Zwd531965692}@pgvector:5432/${PGVECTOR_DB:-vector_db}
      # AGENT_CHECKPOINTER: postgres
      # AGENT_STORE_BACKEND: postgres
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 启用 PG 记忆后端后放开
      # pgvector:
      #   condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/data/chroma
      - trace_logs:/app/logs/agent_trace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  celery-worker:
    image: personal-task-system:latest
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_config", "worker", "--loglevel=info", "--concurrency=4"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root123456}@mysql:3306/${MYSQL_DATABASE:-task_system}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
      AGENT_ENGINE: langgraph
      AGENT_MCP_ENABLED: "true"
      AGENT_CHECKPOINTER: memory
      # 启用 PG 记忆后端后与此处同步放开：
      # AGENT_POSTGRES_URL: postgresql://${PGVECTOR_USER:-postgres}:${PGVECTOR_PASSWORD:-Zwd531965692}@pgvector:5432/${PGVECTOR_DB:-vector_db}
      # AGENT_CHECKPOINTER: postgres
      # AGENT_STORE_BACKEND: postgres
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/data/chroma
      - trace_logs:/app/logs/agent_trace

  celery-beat:
    image: personal-task-system:latest
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_config", "beat", "--loglevel=info"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root123456}@mysql:3306/${MYSQL_DATABASE:-task_system}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  chroma_data:
  trace_logs:
